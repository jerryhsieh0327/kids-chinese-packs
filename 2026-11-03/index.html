<script>window.QUIZ={"date": "2026-11-03", "child": "Seren", "topic": "单元二巩固④：多义字·成语·仿写·修辞·段落大意", "level": 2, "questions": [{"title": "多义字「观」", "level": 2, "topic": "字义", "isReview": true, "q": "「奇观」里加点字「观」的意思是？", "options": {"A": "仔细看", "B": "景象、样子", "C": "观点、看法", "D": "参观、游览"}, "answer": "B", "explanation": "「奇观」指奇特的景象，「观」在这里＝景象、样子。", "wrong": {"A": "「观察」才是仔细看的意思。", "C": "「观点」才是看法。", "D": "「参观」才是去看、游览。"}, "mistakes": "把「观」一律当成「看」或「看法」。"}, {"title": "成语选用", "level": 2, "topic": "成语", "isReview": true, "q": "春天到了，山上草木长得很茂盛，一眼望去绿油油的。下面哪个成语最贴合草木长得好的样子？", "options": {"A": "精疲力竭", "B": "茂盛", "C": "枝繁叶茂", "D": "奔流不息"}, "answer": "C", "explanation": "「枝繁叶茂」形容枝叶又多又密，正贴合草木长得很茂盛的样子。", "wrong": {"A": "「精疲力竭」写人累到极点，跟草木无关。", "B": "「茂盛」是词语，但题目要选成语；选项里更贴合的是「枝繁叶茂」。", "D": "「奔流不息」写水流不停，不是写草木。"}, "mistakes": "把普通词语当成成语，或不看「草木长得好」的语境。"}, {"title": "仿写相关判断", "level": 2, "topic": "仿写", "isReview": true, "q": "老师要求仿写「风越刮越大，雨犹如从天上倒下来。」下面哪一句仿写最合适？", "options": {"A": "天越来越暗，星光犹如一颗颗小灯。", "B": "天黑了，有星星。", "C": "天暗了，犹如我很累。", "D": "风大，雨大，天也暗了。"}, "answer": "A", "explanation": "原句有「越……越……」写变化，又有「犹如」打比方。A 同样有程度变化＋形象比喻。", "wrong": {"B": "只有叙述，没有「越……越……」也没有「犹如」。", "C": "「犹如」后面应是形象的比喻，不是「我很累」这种不相关感受。", "D": "只是并列现象，没有仿到句式重点。"}, "mistakes": "只抄意思、丢掉句式；或「犹如」后接不相干内容。"}, {"title": "比喻还是拟人", "level": 2, "topic": "修辞", "isReview": true, "q": "「小河哼着轻快的歌，绕过山脚向前跑。」这句话主要用了什么修辞？", "options": {"A": "比喻", "B": "拟人", "C": "夸张", "D": "排比"}, "answer": "B", "explanation": "小河「哼歌」「向前跑」，是把物当人来写，属于拟人。", "wrong": {"A": "没有「像／仿佛／犹如」这类比喻词，也没有把一物比作另一物。", "C": "没有故意把程度说得过分。", "D": "排比要有三个以上结构相似的短语或句子。"}, "mistakes": "看到景物就当成比喻；忽略「做人事」才是拟人。"}, {"title": "画面感·感受", "level": 2, "topic": "阅读", "isReview": true, "q": "读到「清晨，江面上雾气慢慢散开，阳光照下来，江水闪着金光」，下面哪一句最像「感受」？", "options": {"A": "雾散了，阳光照在江上。", "B": "我觉得这幅清晨的江景好美，心里一下子变得很安静、很舒服。", "C": "这句话有两个逗号。", "D": "江水是液体。"}, "answer": "B", "explanation": "「感受」要写出自己的心情、态度或体会；A 只是复述内容。", "wrong": {"A": "这是「看见／读到了什么」，还缺少情感／态度。", "C": "这是数标点，不是阅读感受。", "D": "这是常识判断，不是感受。"}, "mistakes": "把「读到了什么」当成「感受到什么」。"}, {"title": "段落大意", "level": 2, "topic": "阅读", "challenge": true, "q": "一篇写盘古的短文：第1段写宇宙像个大鸡蛋，里面漆黑一片；第2段写盘古醒来后用斧头劈开天地，头顶天、脚踏地，身体一天天长高，把天撑得越来越高。第2段的主要意思是？", "options": {"A": "宇宙一开始像个大鸡蛋，里面很黑", "B": "盘古劈开天地并不断撑高天空", "C": "盘古倒下后身体变成了日月山川", "D": "作者喜欢吃鸡蛋"}, "answer": "B", "explanation": "第2段反复写「劈开」「头顶天」「长高」「撑高」，核心是盘古开天并撑高天空。", "wrong": {"A": "那是第1段开头的内容。", "C": "那通常是后面「化身万物」段的内容。", "D": "文中没有这个意思。"}, "mistakes": "把别段内容或个人联想当成这一段的大意。"}]};</script><script src="../assets/quiz.js?v=1"></script></body></html>
