<script>window.QUIZ={"date": "2026-11-06", "child": "Seren", "topic": "单元二巩固⑥：多义字·成语·仿写·修辞·段落大意（第3关）", "level": 3, "questions": [{"title": "多义字「缘」", "level": 3, "topic": "字义", "isReview": true, "q": "读下面两句：①「缘木求鱼」里的「缘」；②「无里雾里，看不清山的边缘」里的「缘」。下面哪一项对两处「缘」的意思判断最准确？", "options": {"A": "①沿着、顺着；②边、边沿", "B": "①因为、由于；②边、边沿", "C": "①攀爬、往上爬；②原因、缘故", "D": "两处都是「边沿」的意思"}, "answer": "A", "explanation": "「缘木求鱼」的「缘」＝沿着、顺着（爬上树去找鱼）；「边缘」的「缘」＝边、边沿。两处意思不同。", "wrong": {"B": "「因为、由于」是「缘」的另一义（如「缘故」），但「缘木」不是这个意思。", "C": "「攀爬」接近「缘木」的动作感，但「缘」本身更准确是「沿着」；且「边缘」不是「缘故」。", "D": "两处「缘」意思并不相同，不能一律当成「边沿」。"}, "mistakes": "把「缘」一律当成「缘故」或「边沿」，不结合整词判断。"}, {"title": "成语选用", "level": 3, "topic": "成语", "isReview": true, "q": "盘古倒下后，他的气息变成风云，声音变成雷霆，眼睛变成日月……整篇神话写的是「第一次开辟天地、开创世界」。若只能选一个成语概括全文主旨，下面哪个最贴切？注意：有的词只写局部细节，不算主旨。", "options": {"A": "精疲力竭", "B": "开天辟地", "C": "奔流不息", "D": "枝繁叶茂"}, "answer": "B", "explanation": "全文主旨是盘古第一次开辟天地。「开天辟地」正写开创天地／前所未有；其余多是局部描写或无关。", "wrong": {"A": "「精疲力竭」只写他用力后的状态，是过程细节，不是全文主旨。", "C": "「奔流不息」常写水流不停，文中或写血脉成江河，仍是局部。", "D": "「枝繁叶茂」写草木茂盛，跟开辟天地的主旨无关。"}, "mistakes": "把细节词（累、流水、草木）当成概括全文的成语。"}, {"title": "仿写相关判断", "level": 3, "topic": "仿写", "isReview": true, "q": "原句：「天越升越高，地越沉越厚，盘古的身体犹如一根顶天立地的柱子。」老师要求仿写时必须同时保留：①「越……越……」写程度变化；②「犹如」后接形象比喻。下面哪一句最符合要求？", "options": {"A": "雾越来越浓，远处的山犹如披上了一层灰纱。", "B": "雾很浓，山看不清，犹如我很着急。", "C": "雾越浓，山越模糊，风也越来越大。", "D": "雾浓了，犹如一层纱，山也像被挡住了。"}, "answer": "A", "explanation": "A 有「越来越」写变化，又有「犹如」接「披上了一层灰纱」的形象比喻，两项都齐。", "wrong": {"B": "「犹如」后接「我很着急」不是形象比喻，且缺少规范的「越……越……」程度变化。", "C": "只有「越……越……」，没有「犹如」比喻。", "D": "有「犹如」，但缺少「越……越……」的程度变化句式。"}, "mistakes": "只仿一半：有变化无比喻，或比喻后接不相干感受。"}, {"title": "比喻还是拟人", "level": 3, "topic": "修辞", "isReview": true, "q": "「雷霆像发怒的巨人，在云层里不停地吼叫。」有同学说这是拟人，有同学说这是比喻。下面哪一项判断最合理？", "options": {"A": "主要是比喻：把雷霆比作发怒的巨人，有「像」；「吼叫」是顺着比喻写的。", "B": "只能是拟人：因为雷霆「吼叫」，物做了人事。", "C": "只能是夸张：声音太大了。", "D": "只能是排比：句子里有两个动作。"}, "answer": "A", "explanation": "句子核心是「像发怒的巨人」——把一物比作另一物，主修辞是比喻；「吼叫」是顺着这个比喻写的，不宜只抓「吼叫」就断定整句只能是拟人。", "wrong": {"B": "「吼叫」确有拟人色彩，但整句靠「像……」构成比喻，主修辞应看核心。", "C": "虽有强烈感，但没有故意把程度说得过分到「夸张」为主。", "D": "排比要有三个以上结构相似的短语或句子，这里没有。"}, "mistakes": "只抓「吼叫」选拟人，忽略整句「像……」的比喻核心。"}, {"title": "画面感·感受", "level": 3, "topic": "阅读", "isReview": true, "q": "短文写：「盘古倒下了。他的气息变成风云，声音变成雷霆，左眼变成太阳，右眼变成月亮，四肢和身躯变成大地山川……」下面哪一句最像「阅读感受」（不是复述情节，也不是常识）？", "options": {"A": "盘古倒下后，身体的各部分变成了风云、雷霆、日月和山川。", "B": "读到这里，我心里又敬佩又难过：他用尽全力才换来光明的世界。", "C": "这句话用了很多「变成」。", "D": "太阳和月亮是天体，山川是地形。"}, "answer": "B", "explanation": "「感受」要写出自己的心情、态度或体会；B 有敬佩、难过，并连到文意。A 只是复述情节。", "wrong": {"A": "这是「读到了什么／情节复述」，还缺少情感或态度。", "C": "这是数用词，不是阅读感受。", "D": "这是常识说明，不是读文后的感受。"}, "mistakes": "把「读到了什么」或「知道什么常识」当成「感受到什么」。"}, {"title": "段落大意", "level": 3, "topic": "阅读", "challenge": true, "q": "一篇短文分三段：第1段写宇宙混沌，像个大鸡蛋，盘古在里面睡了很久才醒来；第2段写他挥斧开天辟地，头顶天、脚踏地，身体不断长高，天地逐渐成形；第3段写他倒下后，气息、声音、眼睛、四肢分别化成风云、雷霆、日月和山川。问：第2段的主要意思是什么？", "options": {"A": "宇宙一开始混沌不明，盘古沉睡其中", "B": "盘古用力分开天地，并不断撑开、长高，让天地成形", "C": "盘古倒下后，身体化成了世间万物", "D": "作者想说明太阳比月亮重要"}, "answer": "B", "explanation": "第2段反复写「开天辟地／顶天踏地／长高／成形」，中心是盘古撑开天地、使天地成形。", "wrong": {"A": "那是第1段「混沌／沉睡」的内容。", "C": "那是第3段「化身万物」的内容。", "D": "文中没有比较日月谁更重要。"}, "mistakes": "把第1段或第3段的内容硬套成第2段大意。"}]};</script><script src="../assets/quiz.js?v=1"></script></body></html>
